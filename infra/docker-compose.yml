# El nombre de proyecto se fija a "arriendos360" para que los volumenes y la red
# conserven el mismo prefijo aunque este archivo viva en infra/ (si no, Compose usaria
# el nombre de la carpeta, "infra").
name: arriendos360

services:
  # Base de Datos Relacional
  db:
    image: postgres:15-alpine
    container_name: arriendos360_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: arriendos360_db
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  # Servidor Backend
  backend:
    build: ../apps/gateway
    container_name: arriendos360_api
    command: npm run dev
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - DB_HOST=db
      - DB_USER=postgres
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=arriendos360_db
      - JWT_SECRET=${JWT_SECRET}
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    depends_on:
      - db
    volumes:
      - ../apps/gateway:/app
      - /app/node_modules

  # Aplicación Frontend
  frontend:
    build: ../apps/web
    container_name: arriendos360_ui
    command: npm start
    ports:
      - "3000:3000"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - WDS_SOCKET_PORT=0
    depends_on:
      - backend
    volumes:
      - ../apps/web:/app
      - /app/node_modules

volumes:
  db_data: