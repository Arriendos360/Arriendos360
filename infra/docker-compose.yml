# El nombre de proyecto se fija a "arriendos360" para que los volumenes y la red
# conserven el mismo prefijo aunque este archivo viva en infra/ (si no, Compose usaria
# el nombre de la carpeta, "infra").
name: arriendos360

services:
  # Base de Datos Relacional
  db:
    image: postgres:15-alpine
    container_name: arriendos360_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: arriendos360_db
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    # Sin esto, `depends_on` solo espera a que el CONTENEDOR arranque, no a que
    # Postgres acepte conexiones. Con un volumen recien creado la inicializacion
    # tarda ~10 s, el gateway intenta migrar antes de tiempo y nodemon se cae con
    # ECONNREFUSED. Dejaba `up` desde cero dependiendo de un `restart` manual.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d arriendos360_db"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  # MS-Identidad — usuarios, roles, autenticacion y revocacion.
  #
  # Ya esta cableado: MS_IDENTIDAD_URL apunta aqui, asi que la costura del
  # gateway reenvia /api/auth y /api/usuarios a este servicio. Sus tablas viven
  # en el esquema `identidad`; el gateway solo conoce `public`.
  ms-identidad:
    build:
      context: ..
      dockerfile: services/ms-identidad/Dockerfile
    container_name: arriendos360_identidad
    command: npm run dev
    ports:
      - "3011:3011"
    environment:
      - PORT=3011
      - DB_HOST=db
      - DB_USER=postgres
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=arriendos360_db
      - DB_NAME_TEST=arriendos360_test
      # Identico al del gateway: los dos verifican la misma firma.
      - JWT_SECRET=${JWT_SECRET}
      # Autenticacion entre servicios para /interno. Clave DISTINTA de
      # JWT_SECRET a proposito: si fueran la misma, el token de cualquier
      # usuario serviria para llamar a /interno.
      - SERVICIO_JWT_SECRET=${SERVICIO_JWT_SECRET}
      - SERVICIO_NOMBRE=ms-identidad
      # Base publica de la SPA, para el enlace del correo de recuperacion.
      - URL_APP=${URL_APP:-http://localhost:3000}
      # Correo. Sin EMAIL_USER apunta a un buzon de pruebas y no llega a nadie.
      - EMAIL_HOST=${EMAIL_HOST:-smtp.ethereal.email}
      - EMAIL_PORT=${EMAIL_PORT:-587}
      - EMAIL_USER=${EMAIL_USER:-}
      - EMAIL_PASS=${EMAIL_PASS:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ../services/ms-identidad:/repo/services/ms-identidad
      - /repo/services/ms-identidad/node_modules

  # MS-Inmuebles — inmuebles del propietario y su estado de ocupacion.
  #
  # Ya esta cableado: MS_INMUEBLES_URL apunta aqui, asi que la costura del
  # gateway reenvia /api/inmuebles a este servicio. Su tabla vive en el esquema
  # `inmuebles`; el gateway ya no la tiene.
  ms-inmuebles:
    build:
      context: ..
      dockerfile: services/ms-inmuebles/Dockerfile
    container_name: arriendos360_inmuebles
    command: npm run dev
    ports:
      - "3012:3012"
    environment:
      - PORT=3012
      - DB_HOST=db
      - DB_USER=postgres
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=arriendos360_db
      - DB_NAME_TEST=arriendos360_test
      # Identico al del gateway: los tres verifican la misma firma.
      - JWT_SECRET=${JWT_SECRET}
      - SERVICIO_JWT_SECRET=${SERVICIO_JWT_SECRET}
      - SERVICIO_NOMBRE=ms-inmuebles
      # De donde saca la lista de revocados. Sin esto el servicio arranca pero
      # NO comprueba revocacion, y lo avisa en el log.
      - MS_IDENTIDAD_URL=${MS_IDENTIDAD_URL:-http://ms-identidad:3011}
    depends_on:
      db:
        condition: service_healthy
      ms-identidad:
        condition: service_started
    volumes:
      - ../services/ms-inmuebles:/repo/services/ms-inmuebles
      - /repo/services/ms-inmuebles/node_modules
    # El servicio solo escucha DESPUES de aplicar sus migraciones, asi que
    # responder aqui significa «ya adopte los inmuebles que estaban en el
    # esquema del gateway». Es lo que permite que la migracion del gateway que
    # retira `public.inmuebles` no pueda adelantarse a la copia.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3012/ || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s

  # Servidor Backend
  backend:
    # Contexto en la raiz del monorepo: el gateway depende de packages/shared
    # como workspace y database/ tiene que entrar en la imagen.
    build:
      context: ..
      dockerfile: apps/gateway/Dockerfile
    container_name: arriendos360_api
    command: npm run dev
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - DB_HOST=db
      - DB_USER=postgres
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=arriendos360_db
      - JWT_SECRET=${JWT_SECRET}
      - SERVICIO_JWT_SECRET=${SERVICIO_JWT_SECRET}
      - SERVICIO_NOMBRE=gateway
      # Enrutamiento: vacias = todos los prefijos resuelven local. Poner una URL
      # aqui hace que el gateway reenvie ese prefijo al microservicio.
      # Cableados: identidad (dos prefijos) e inmuebles.
      - MS_IDENTIDAD_URL=${MS_IDENTIDAD_URL:-http://ms-identidad:3011}
      - MS_INMUEBLES_URL=${MS_INMUEBLES_URL:-http://ms-inmuebles:3012}
      - MS_CONTRATOS_URL=${MS_CONTRATOS_URL:-}
      - MS_FINANCIERO_URL=${MS_FINANCIERO_URL:-}
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    depends_on:
      db:
        condition: service_healthy
      # El gateway carga su cache de revocados al arrancar; si ms-identidad no
      # esta en pie, arranca con la cache vacia y un aviso en el log.
      ms-identidad:
        condition: service_started
      # Aqui SI es service_healthy, y no por comodidad: la migracion
      # `dominio/002` retira `public.inmuebles`, y no puede correr antes de que
      # ms-inmuebles haya copiado las filas a su esquema. Sano = ya migro.
      ms-inmuebles:
        condition: service_healthy
    volumes:
      # Recarga en caliente del codigo del gateway. `packages/` y `database/`
      # NO se montan: viven dentro de la imagen, asi que tocarlos exige
      # reconstruir. Es el precio de que la imagen sea autosuficiente.
      - ../apps/gateway:/repo/apps/gateway
      # Evita que el node_modules del host (binarios de Windows) tape al de la
      # imagen. Hoy npm iza todo a /repo/node_modules y este queda vacio, pero
      # basta un conflicto de versiones para que deje de estarlo.
      - /repo/apps/gateway/node_modules

  # Aplicación Frontend
  frontend:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    container_name: arriendos360_ui
    command: npm start
    ports:
      - "3000:3000"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - WDS_SOCKET_PORT=0
    depends_on:
      - backend
    volumes:
      - ../apps/web:/repo/apps/web
      - /repo/apps/web/node_modules

volumes:
  db_data: