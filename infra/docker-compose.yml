# El nombre de proyecto se fija a "arriendos360" para que los volumenes y la red
# conserven el mismo prefijo aunque este archivo viva en infra/ (si no, Compose usaria
# el nombre de la carpeta, "infra").
name: arriendos360

services:
  # Base de Datos Relacional
  db:
    image: postgres:15-alpine
    container_name: arriendos360_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: arriendos360_db
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    # Sin esto, `depends_on` solo espera a que el CONTENEDOR arranque, no a que
    # Postgres acepte conexiones. Con un volumen recien creado la inicializacion
    # tarda ~10 s, el gateway intenta migrar antes de tiempo y nodemon se cae con
    # ECONNREFUSED. Dejaba `up` desde cero dependiendo de un `restart` manual.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d arriendos360_db"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  # MS-Identidad — usuarios, roles, autenticacion y revocacion.
  #
  # Ya esta cableado: MS_IDENTIDAD_URL apunta aqui, asi que la costura del
  # gateway reenvia /api/auth y /api/usuarios a este servicio. Sus tablas viven
  # en el esquema `identidad`; el gateway solo conoce `public`.
  ms-identidad:
    build:
      context: ..
      dockerfile: services/ms-identidad/Dockerfile
    container_name: arriendos360_identidad
    command: npm run dev
    ports:
      - "3011:3011"
    environment:
      - PORT=3011
      - DB_HOST=db
      - DB_USER=postgres
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=arriendos360_db
      - DB_NAME_TEST=arriendos360_test
      # Identico al del gateway: los dos verifican la misma firma.
      - JWT_SECRET=${JWT_SECRET}
      # Autenticacion entre servicios para /interno. Clave DISTINTA de
      # JWT_SECRET a proposito: si fueran la misma, el token de cualquier
      # usuario serviria para llamar a /interno.
      - SERVICIO_JWT_SECRET=${SERVICIO_JWT_SECRET}
      - SERVICIO_NOMBRE=ms-identidad
      # Base publica de la SPA, para el enlace del correo de recuperacion.
      - URL_APP=${URL_APP:-http://localhost:3000}
      # Correo. Sin EMAIL_USER apunta a un buzon de pruebas y no llega a nadie.
      - EMAIL_HOST=${EMAIL_HOST:-smtp.ethereal.email}
      - EMAIL_PORT=${EMAIL_PORT:-587}
      - EMAIL_USER=${EMAIL_USER:-}
      - EMAIL_PASS=${EMAIL_PASS:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ../services/ms-identidad:/repo/services/ms-identidad
      - /repo/services/ms-identidad/node_modules

  # MS-Inmuebles — inmuebles del propietario y su estado de ocupacion.
  #
  # Ya esta cableado: MS_INMUEBLES_URL apunta aqui, asi que la costura del
  # gateway reenvia /api/inmuebles a este servicio. Su tabla vive en el esquema
  # `inmuebles`; el gateway ya no la tiene.
  ms-inmuebles:
    build:
      context: ..
      dockerfile: services/ms-inmuebles/Dockerfile
    container_name: arriendos360_inmuebles
    command: npm run dev
    ports:
      - "3012:3012"
    environment:
      - PORT=3012
      - DB_HOST=db
      - DB_USER=postgres
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=arriendos360_db
      - DB_NAME_TEST=arriendos360_test
      # Identico al del gateway: los tres verifican la misma firma.
      - JWT_SECRET=${JWT_SECRET}
      - SERVICIO_JWT_SECRET=${SERVICIO_JWT_SECRET}
      - SERVICIO_NOMBRE=ms-inmuebles
      # De donde saca la lista de revocados. Sin esto el servicio arranca pero
      # NO comprueba revocacion, y lo avisa en el log.
      - MS_IDENTIDAD_URL=${MS_IDENTIDAD_URL:-http://ms-identidad:3011}
    depends_on:
      db:
        condition: service_healthy
      ms-identidad:
        condition: service_started
    volumes:
      - ../services/ms-inmuebles:/repo/services/ms-inmuebles
      - /repo/services/ms-inmuebles/node_modules
    # El servicio solo escucha DESPUES de aplicar sus migraciones, asi que
    # responder aqui significa «ya adopte los inmuebles que estaban en el
    # esquema del gateway». Es lo que permite que la migracion del gateway que
    # retira `public.inmuebles` no pueda adelantarse a la copia.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3012/ || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s

  # MS-Contratos — contratos, sus anexos y los eventos de su ciclo de vida.
  #
  # Es el PRODUCTOR del bus desde el paso 6d: su tabla de salida vive en el
  # esquema `contratos` y su publicador corre en este proceso. El gateway dejo de
  # tener las dos cosas.
  ms-contratos:
    build:
      context: ..
      dockerfile: services/ms-contratos/Dockerfile
    container_name: arriendos360_contratos
    command: npm run dev
    ports:
      - "3013:3013"
    environment:
      - PORT=3013
      - DB_HOST=db
      - DB_USER=postgres
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=arriendos360_db
      - DB_NAME_TEST=arriendos360_test
      # Identico al del gateway: todos verifican la misma firma.
      - JWT_SECRET=${JWT_SECRET}
      - SERVICIO_JWT_SECRET=${SERVICIO_JWT_SECRET}
      - SERVICIO_NOMBRE=ms-contratos
      # A quien pregunta. Identidad, para la revocacion y para comprobar el
      # inquilino; Inmuebles, para resolver la pertenencia de cada contrato.
      # Core dependiendo de Soporte, que es la direccion correcta.
      - MS_IDENTIDAD_URL=${MS_IDENTIDAD_URL:-http://ms-identidad:3011}
      # Y ADEMAS son la lista de suscriptores del bus. Desde el paso 6e son DOS:
      # `ContratoFormalizado` va a ms-inmuebles, que pone el inmueble en
      # `arrendado`, y a ms-financiero, que crea la primera cuenta de cobro.
      # `ContratoFinalizado` va solo a ms-inmuebles: finalizar un contrato no
      # cancela lo que se debe.
      #
      # OJO al arranque en frio: si ms-financiero no esta en pie cuando se
      # entrega un evento, la fila NO se marca entregada y se reintenta a los
      # dos. Por eso ms-inmuebles descarta repetidos, y por eso ms-financiero
      # tiene que hacerlo tambien.
      - MS_INMUEBLES_URL=${MS_INMUEBLES_URL:-http://ms-inmuebles:3012}
      - MS_FINANCIERO_URL=${MS_FINANCIERO_URL:-http://ms-financiero:3014}
      # Cada cuanto barre el publicador su tabla de salida. Ese numero es la
      # ventana de consistencia del estado del inmueble.
      - EVENTOS_INTERVALO_MS=${EVENTOS_INTERVALO_MS:-5000}
      # Almacenamiento de anexos. Vacia = disco del contenedor, que es lo que se
      # quiere en desarrollo. Con cadena de conexion se usa Azure Blob.
      - AZURE_STORAGE_CONNECTION_STRING=${AZURE_STORAGE_CONNECTION_STRING:-}
      - AZURE_STORAGE_CONTENEDOR=${AZURE_STORAGE_CONTENEDOR:-anexos}
    depends_on:
      db:
        condition: service_healthy
      ms-identidad:
        condition: service_started
      ms-inmuebles:
        condition: service_started
    volumes:
      - ../services/ms-contratos:/repo/services/ms-contratos
      - /repo/services/ms-contratos/node_modules
    # El servicio solo escucha DESPUES de aplicar sus migraciones, asi que
    # responder aqui significa «ya adopte los contratos, los anexos y los eventos
    # pendientes que estaban en el esquema del gateway». Es lo que permite que la
    # migracion del gateway que retira `public.contratos` no pueda adelantarse a
    # la copia.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3013/ || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s

  # MS-Financiero — cuentas de cobro, transacciones y el motor de facturacion.
  #
  # El ultimo servicio del paso 6, y el que deja al gateway sin tablas propias.
  # MS_FINANCIERO_URL apunta aqui, asi que la costura reenvia /api/pagos a este
  # servicio. Sus dos tablas viven en el esquema `financiero`.
  #
  # Es CONSUMIDOR del bus: `ContratoFormalizado` le llega por POST
  # /interno/eventos desde el publicador de ms-contratos, y con el crea la
  # primera cuenta de cobro. Es el caso que el Capitulo 2 especifica
  # textualmente. No es productor: no emite ningun evento todavia, asi que no
  # tiene tabla de salida ni publicador.
  ms-financiero:
    build:
      context: ..
      dockerfile: services/ms-financiero/Dockerfile
    container_name: arriendos360_financiero
    command: npm run dev
    ports:
      - "3014:3014"
    environment:
      - PORT=3014
      - DB_HOST=db
      - DB_USER=postgres
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=arriendos360_db
      - DB_NAME_TEST=arriendos360_test
      # Identico al del gateway: todos verifican la misma firma.
      - JWT_SECRET=${JWT_SECRET}
      - SERVICIO_JWT_SECRET=${SERVICIO_JWT_SECRET}
      - SERVICIO_NOMBRE=ms-financiero
      # A quien pregunta. Contratos, para la pertenencia de cada cuenta de cobro
      # y para los datos que imprimen los comprobantes —el inmueble viaja DENTRO
      # del contrato, con `incluir=inmueble`, asi que este servicio no habla con
      # ms-inmuebles—. Identidad, para la revocacion y para los correos del motor.
      - MS_CONTRATOS_URL=${MS_CONTRATOS_URL:-http://ms-contratos:3013}
      - MS_IDENTIDAD_URL=${MS_IDENTIDAD_URL:-http://ms-identidad:3011}
      # Correo del motor. Sin EMAIL_USER apunta a un buzon de pruebas y no llega
      # a nadie. En el paso 7 esto se va: el motor pasara a publicar eventos y
      # sera ms-notificaciones quien mande los avisos.
      - EMAIL_HOST=${EMAIL_HOST:-smtp.ethereal.email}
      - EMAIL_PORT=${EMAIL_PORT:-587}
      - EMAIL_USER=${EMAIL_USER:-}
      - EMAIL_PASS=${EMAIL_PASS:-}
    depends_on:
      db:
        condition: service_healthy
      ms-identidad:
        condition: service_started
      ms-contratos:
        condition: service_started
    volumes:
      - ../services/ms-financiero:/repo/services/ms-financiero
      - /repo/services/ms-financiero/node_modules
    # El servicio solo escucha DESPUES de aplicar sus migraciones, y una de ellas
    # —`database/financiero/002`— copia las cuentas de cobro que estaban en
    # `public` y RETIRA el original en la misma transaccion. Responder aqui
    # significa que esa mudanza ya ocurrio.
    #
    # A diferencia de las tres extracciones anteriores, el gateway no tiene que
    # esperar a esto para retirar nada: se quedo sin base, asi que ya no aplica
    # migraciones. Sigue dependiendo del healthcheck por otra razon —el dashboard
    # le pregunta las cifras de dinero nada mas arrancar.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3014/ || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s

  # Servidor Backend
  backend:
    # Contexto en la raiz del monorepo: el gateway depende de packages/shared
    # como workspace y database/ tiene que entrar en la imagen.
    build:
      context: ..
      dockerfile: apps/gateway/Dockerfile
    container_name: arriendos360_api
    command: npm run dev
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      # SIN DB_*: desde el paso 6e el gateway NO TIENE TABLAS ni conexion a
      # PostgreSQL. `cuentas_cobro` y `transacciones` eran las dos ultimas y se
      # fueron con ms-financiero. Arranca sin base, que es lo que se espera de un
      # Policy Enforcement Point.
      - JWT_SECRET=${JWT_SECRET}
      - SERVICIO_JWT_SECRET=${SERVICIO_JWT_SECRET}
      - SERVICIO_NOMBRE=gateway
      # Enrutamiento. DESDE EL PASO 6e LAS CUATRO ESTAN CABLEADAS: no queda
      # codigo local al que caer. Los cinco prefijos de la API los sirven los
      # servicios, y el unico que se resuelve en el gateway es /api/dashboard,
      # que no aparece aqui porque no tiene servicio propio (regla dura 5).
      #
      # Estas URL sirven ADEMAS para componer: el dashboard le pide a los tres
      # las cifras que agrega, y `clientes/` las usa para la pertenencia y para
      # el guardia de borrado.
      #
      # Lo que NO hacen es alimentar el bus: el publicador se fue con
      # ms-contratos, que es quien escribe el contrato y quien lo anuncia.
      - MS_IDENTIDAD_URL=${MS_IDENTIDAD_URL:-http://ms-identidad:3011}
      - MS_INMUEBLES_URL=${MS_INMUEBLES_URL:-http://ms-inmuebles:3012}
      - MS_CONTRATOS_URL=${MS_CONTRATOS_URL:-http://ms-contratos:3013}
      - MS_FINANCIERO_URL=${MS_FINANCIERO_URL:-http://ms-financiero:3014}
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    depends_on:
      # SIN `db`: el gateway ya no se conecta a PostgreSQL.
      #
      # Y ninguno de estos es ya `service_healthy` por la razon que lo era hasta
      # el 6d —esperar a que el servicio copiara sus tablas antes de que el
      # gateway retirara las originales—. Esa coreografia desaparecio con las
      # migraciones del gateway: ahora cada servicio adopta Y retira lo suyo.
      #
      # Se espera a que esten ARRANCADOS y no sanos porque el gateway degrada
      # bien mientras no lo esten: la cache de revocados arranca vacia con un
      # aviso, y el dashboard responde 502 en vez de cifras en cero.
      ms-identidad:
        condition: service_started
      ms-inmuebles:
        condition: service_started
      ms-contratos:
        condition: service_started
      ms-financiero:
        condition: service_started
    volumes:
      # Recarga en caliente del codigo del gateway. `packages/` y `database/`
      # NO se montan: viven dentro de la imagen, asi que tocarlos exige
      # reconstruir. Es el precio de que la imagen sea autosuficiente.
      #
      # El montaje de `almacenamiento/` se fue con los anexos en el paso 6d:
      # ahora es el volumen de ms-contratos el que hace que los archivos
      # sobrevivan a un `docker compose down`.
      - ../apps/gateway:/repo/apps/gateway
      # Evita que el node_modules del host (binarios de Windows) tape al de la
      # imagen. Hoy npm iza todo a /repo/node_modules y este queda vacio, pero
      # basta un conflicto de versiones para que deje de estarlo.
      - /repo/apps/gateway/node_modules

  # Aplicación Frontend
  frontend:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    container_name: arriendos360_ui
    command: npm start
    ports:
      - "3000:3000"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - WDS_SOCKET_PORT=0
    depends_on:
      - backend
    volumes:
      - ../apps/web:/repo/apps/web
      - /repo/apps/web/node_modules

volumes:
  db_data: