# Despliegue completo en Azure (corte 6, docs/adr/0022).
#
# Repite lo que hasta ahora se hacía a mano, en el mismo orden y con los mismos scripts de
# `infra/azure`: pruebas → imágenes → base → sitio de la SPA → migraciones → apps → contenido
# de la SPA → humo.
#
# Se dispara con cada push a `main` —fusionar un PR es desplegarlo— y a mano cuando haya que
# repetirlo o sembrar. Un push que sólo toca documentación no despliega nada. Lo que no cambió
# no se redespliega: la etiqueta de cada imagen es el último commit que tocó ese servicio, así
# que su plantilla queda idéntica y Container Apps no le crea revisión.
#
# El trabajo que toca Azure vive en el entorno `produccion`, que es el sujeto exacto de la
# credencial federada (`repo:Arriendos360/Arriendos360:environment:produccion`): con otro
# nombre, OIDC no entra. Ahí se pone una aprobación obligatoria si se quiere una puerta humana
# entre el push y Azure.
#
# NINGÚN SECRETO EN GITHUB: la sesión de Azure se abre con OIDC contra
# `id-arriendos360-despliegue`, las imágenes se publican con el GITHUB_TOKEN de la ejecución
# y el token del Static Web App se pide al vuelo. Lo único que hay en el entorno son tres
# variables que no son secretas: AZURE_CLIENT_ID, AZURE_TENANT_ID y AZURE_SUBSCRIPTION_ID.
#
# Repetirlo sin cambios es inocuo: el Bicep converge, las migraciones ya aplicadas se saltan
# y el seed no repite usuarios. Para volver atrás, `docs/despliegue.md` § «Revertir un
# despliegue».

name: Desplegar

on:
  push:
    branches: [main]
    # Un cambio de documentación no toca ninguna imagen ni ningún Bicep: no hay nada que
    # desplegar. Si el push trae además código, sí corre.
    paths-ignore:
      - '**.md'
      - docs/**
  workflow_dispatch:
    inputs:
      sembrar:
        description: Ejecutar también el Job de datos de demostración
        type: boolean
        default: false

permissions:
  contents: read
  # OIDC contra Azure; sin esto no hay sesión.
  id-token: write
  packages: write

# Dos despliegues a la vez se pisarían en las mismas revisiones; se encolan.
concurrency:
  group: despliegue
  cancel-in-progress: false

jobs:
  # Las mismas que corren en cada PR, para no mantener dos copias de la receta.
  pruebas:
    name: Pruebas
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    uses: ./.github/workflows/pruebas.yml

  imagenes:
    name: Imágenes
    needs: pruebas
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/imagenes.yml

  desplegar:
    name: Desplegar en Azure
    needs: imagenes
    runs-on: ubuntu-latest
    # Da la sesión de Azure (OIDC) y, si el entorno tiene revisores, la aprobación humana.
    environment: produccion
    env:
      # Los scripts preguntan antes de crear o cambiar; en un workflow no hay quien conteste,
      # y la aprobación del entorno ya cumple esa función.
      CONFIRMADO: si
    steps:
      - uses: actions/checkout@v4
        with:
          # Los scripts calculan la etiqueta de cada servicio con `git log`: sin historia, no
          # saben qué cambió.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm

      - name: Entrar a Azure con OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Preparar Bicep
        run: az bicep install

      - name: Infraestructura base
        run: bash infra/azure/desplegar-base.sh

      # El sitio ANTES que las apps: el gateway limita el CORS a su origen y los correos
      # enlazan ahí. El contenido se sube al final, cuando ya hay gateway contra el que
      # compilar.
      - name: Sitio de la SPA
        run: PASO=sitio bash infra/azure/desplegar-spa.sh

      # Va ANTES de mover los Jobs: la comparación es contra las etiquetas que hay desplegadas,
      # y `desplegar-trabajos.sh` las reemplaza.
      - name: Qué esquemas migrar
        run: |
          {
            echo 'MIGRAR<<FIN'
            bash infra/azure/servicios-a-migrar.sh
            echo FIN
          } >> "$GITHUB_ENV"

      - name: Jobs de migración y seed
        run: bash infra/azure/desplegar-trabajos.sh

      # En Azure los servicios no migran al arrancar y con una migración pendiente se niegan a
      # arrancar, así que esto va antes de publicar las revisiones nuevas. Sólo los esquemas
      # de los servicios que cambiaron: los demás no tienen nada que aplicar.
      - name: Aplicar migraciones
        run: |
          if [ -z "${MIGRAR// /}" ]; then
            echo "Ningún servicio cambió: no hay migraciones que aplicar."
            exit 0
          fi
          for esquema in $MIGRAR; do
            bash infra/azure/ejecutar-trabajo.sh "migrar-$esquema"
          done

      # Sólo a mano: en un push nadie lo pide e `inputs` viene vacío.
      - name: Datos de demostración
        if: github.event_name == 'workflow_dispatch' && inputs.sembrar
        run: bash infra/azure/ejecutar-trabajo.sh seed-identidad

      - name: Apps y Job del motor
        run: bash infra/azure/desplegar-apps.sh

      - name: Contenido de la SPA
        run: PASO=contenido bash infra/azure/desplegar-spa.sh

      - name: Humo
        run: bash infra/azure/humo.sh

      - name: Resumen
        if: always()
        run: |
          {
            echo "### Despliegue ${GITHUB_SHA}"
            echo
            echo "- Gateway: $(az deployment group show -g rg-arriendos360 -n apps --query properties.outputs.urlGateway.value -o tsv 2>/dev/null)"
            echo "- SPA: $(az deployment group show -g rg-arriendos360 -n spa --query properties.outputs.url.value -o tsv 2>/dev/null)"
          } >> "$GITHUB_STEP_SUMMARY"
