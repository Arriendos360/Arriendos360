# Publica en GHCR sólo las imágenes que hagan falta (docs/adr/0022).
#
# La etiqueta de cada imagen es **el último commit que tocó ese servicio**, no el de la rama.
# Si sólo cambió ms-inmuebles, las otras cinco ya están publicadas con su etiqueta y no se
# reconstruyen; si no cambió ninguno, no se construye nada. Qué rutas componen cada imagen lo
# decide `infra/azure/etiquetas.sh`, el mismo cálculo que usan los scripts de despliegue.
#
# Manual, o llamado por «Desplegar». Publica con el GITHUB_TOKEN de la ejecución: sin secretos
# guardados y sin tocar Azure.

name: Imágenes

on:
  workflow_dispatch:
  workflow_call:
    outputs:
      etiquetas:
        description: 'Etiqueta publicada de cada servicio, como {"gateway":"<commit>", …}.'
        value: ${{ jobs.etiquetas.outputs.etiquetas }}

permissions:
  contents: read
  packages: write

concurrency:
  group: imagenes
  cancel-in-progress: false

jobs:
  etiquetas:
    name: Qué hay que construir
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      etiquetas: ${{ steps.calcular.outputs.etiquetas }}
      matriz: ${{ steps.calcular.outputs.matriz }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Sin historia no hay `git log`, y sin `git log` no hay etiqueta por servicio.
          fetch-depth: 0

      # Para preguntarle al registro si una imagen ya existe.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: calcular
        run: bash infra/azure/etiquetas-pendientes.sh >> "$GITHUB_OUTPUT"

  imagen:
    name: ${{ matrix.nombre }}
    needs: etiquetas
    if: needs.etiquetas.outputs.matriz != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.etiquetas.outputs.matriz) }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: produccion
          push: true
          # Sin atestación de procedencia: la imagen queda como un manifiesto simple, el
          # formato más compatible con el registro de Container Apps.
          provenance: false
          tags: ghcr.io/arriendos360/${{ matrix.nombre }}:${{ matrix.etiqueta }}
          # `source` enlaza el paquete con el repositorio: quien puede leer el repositorio
          # puede descargar la imagen, incluido el token de Container Apps.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ matrix.etiqueta }}
          cache-from: type=gha,scope=${{ matrix.nombre }}
          cache-to: type=gha,mode=max,scope=${{ matrix.nombre }}
